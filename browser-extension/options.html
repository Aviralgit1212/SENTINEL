<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SENTINEL AI Guardian Settings</title><style>body{font:15px system-ui;max-width:680px;margin:36px auto;padding:0 18px;color:#111827}label{display:block;margin:18px 0 6px}input{width:100%;padding:10px;box-sizing:border-box}button{margin-top:18px;padding:10px 16px}small{color:#4b5563}</style></head><body><h1>SENTINEL AI Guardian</h1><p>Configure the local SENTINEL gateway. The pairing token is stored in this browser profile and sent only to the configured localhost endpoint.</p><label for="gateway">Gateway URL</label><input id="gateway" value="http://127.0.0.1:5001"><label for="token">Pairing token</label><input id="token" type="password" autocomplete="off"><small>Set the same token in the server's SENTINEL_EXTENSION_TOKEN environment variable and configure the extension origin on the server.</small><br><button id="save">Save settings</button><p id="status" role="status"></p><script src="options.js"></script></body></html>
